<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Meu Financeiro</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#f3f5f7;
color:#222;
}
header{
background:#111827;
color:white;
padding:24px 18px;
text-align:center;
}
header h1{margin:0;font-size:28px}
header p{margin:6px 0 0;color:#cbd5e1}

.container{
max-width:700px;
margin:auto;
padding:18px;
}

.saldo{
background:#111827;
color:white;
border-radius:18px;
padding:22px;
margin-bottom:16px;
box-shadow:0 5px 15px #0002;
}
.saldo small{color:#cbd5e1}
.saldo h2{
font-size:34px;
margin:8px 0 0;
}

.cards{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-bottom:18px;
}
.card{
background:white;
padding:18px;
border-radius:15px;
box-shadow:0 3px 10px #0001;
}
.card small{color:#666}
.card strong{
display:block;
font-size:21px;
margin-top:6px;
}
.entrada{color:#16803c}
.saida{color:#c62828}

.form{
background:white;
padding:18px;
border-radius:18px;
box-shadow:0 3px 10px #0001;
margin-bottom:18px;
}
.form h3{margin-top:0}

input,select,button{
width:100%;
padding:13px;
border-radius:10px;
border:1px solid #ddd;
font-size:16px;
margin-bottom:10px;
}

button{
background:#16a34a;
color:white;
border:0;
font-weight:bold;
cursor:pointer;
}

button:hover{background:#15803d}

.lancamento{
background:white;
padding:15px;
border-radius:14px;
margin-bottom:10px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 7px #0001;
}

.lancamento strong{display:block}
.lancamento small{color:#777}

.valor{font-weight:bold}
.excluir{
background:#ef4444;
width:auto;
padding:8px 11px;
margin:0 0 0 10px;
}

.vazio{
text-align:center;
color:#777;
padding:25px;
}
</style>
</head>

<body>

<header>
<h1>💰 Meu Financeiro</h1>
<p>Controle simples das suas finanças</p>
</header>

<div class="container">

<div class="saldo">
<small>Saldo atual</small>
<h2 id="saldo">R$ 0,00</h2>
</div>

<div class="cards">
<div class="card">
<small>Entradas</small>
<strong class="entrada" id="entradas">R$ 0,00</strong>
</div>

<div class="card">
<small>Despesas</small>
<strong class="saida" id="despesas">R$ 0,00</strong>
</div>
</div>

<div class="form">
<h3>➕ Novo lançamento</h3>

<input id="descricao" type="text" placeholder="Descrição">

<input id="valor" type="number" step="0.01" placeholder="Valor">

<select id="tipo">
<option value="entrada">Entrada</option>
<option value="saida">Despesa</option>
</select>

<select id="categoria">
<option>Salário</option>
<option>Alimentação</option>
<option>Casa</option>
<option>Transporte</option>
<option>Compras</option>
<option>Lazer</option>
<option>Contas</option>
<option>Outros</option>
</select>

<input id="data" type="date">

<button onclick="adicionar()">Adicionar lançamento</button>
</div>

<h3>📋 Lançamentos</h3>

<div id="lista"></div>

</div>

<script>

let lancamentos =
JSON.parse(localStorage.getItem("meuFinanceiro")) || [];

document.getElementById("data").value =
new Date().toISOString().split("T")[0];

function dinheiro(valor){
return valor.toLocaleString("pt-BR",{
style:"currency",
currency:"BRL"
});
}

function salvar(){
localStorage.setItem(
"meuFinanceiro",
JSON.stringify(lancamentos)
);
}

function adicionar(){

const descricao =
document.getElementById("descricao").value.trim();

const valor =
parseFloat(document.getElementById("valor").value);

const tipo =
document.getElementById("tipo").value;

const categoria =
document.getElementById("categoria").value;

const data =
document.getElementById("data").value;

if(!descricao || !valor || valor<=0){
alert("Preencha a descrição e o valor.");
return;
}

lancamentos.push({
id:Date.now(),
descricao,
valor,
tipo,
categoria,
data
});

salvar();

document.getElementById("descricao").value="";
document.getElementById("valor").value="";

mostrar();
}

function excluir(id){

lancamentos =
lancamentos.filter(item=>item.id!==id);

salvar();
mostrar();
}

function mostrar(){

let entradas=0;
let despesas=0;

lancamentos.forEach(item=>{

if(item.tipo==="entrada")
entradas+=item.valor;

else
despesas+=item.valor;

});

document.getElementById("entradas").textContent =
dinheiro(entradas);

document.getElementById("despesas").textContent =
dinheiro(despesas);

document.getElementById("saldo").textContent =
dinheiro(entradas-despesas);

const lista =
document.getElementById("lista");

lista.innerHTML="";

if(lancamentos.length===0){

lista.innerHTML =
'<div class="vazio">Nenhum lançamento cadastrado.</div>';

return;
}

lancamentos
.slice()
.reverse()
.forEach(item=>{

const div=document.createElement("div");

div.className="lancamento";

const sinal =
item.tipo==="entrada" ? "+" : "-";

const classe =
item.tipo==="entrada" ? "entrada" : "saida";

div.innerHTML=`

<div>
<strong>${item.descricao}</strong>
<small>
${item.categoria} • ${item.data}
</small>
</div>

<div style="display:flex;align-items:center">
<span class="valor ${classe}">
${sinal} ${dinheiro(item.valor)}
</span>

<button class="excluir"
onclick="excluir(${item.id})">
×
</button>
</div>

`;

lista.appendChild(div);

});

}

mostrar();

</script>

</body>
</html>
